<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>رزنامة — التقويم والمهام</title>

  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" id="manifestLink" />

  <link rel="stylesheet" href="./assets/fonts/fonts.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle" aria-label="القائمة"></button>
      <div class="brand">
        <img class="brand-mark" src="./assets/icon.svg" alt="" width="22" height="22" />
        <span>رزنامة</span>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="الوضع الليلي"></button>
    </header>

    <nav class="sidenav" id="sidenav">
      <a href="#/calendar" data-route="calendar" data-icon="calendar" class="nav-link"><span class="nav-icon"></span>التقويم</a>
      <a href="#/tasks" data-route="tasks" data-icon="tasks" class="nav-link"><span class="nav-icon"></span>المهام</a>
      <a href="#/types" data-route="types" data-icon="tag" class="nav-link"><span class="nav-icon"></span>أنواع المهام</a>
      <a href="#/habits" data-route="habits" data-icon="target" class="nav-link"><span class="nav-icon"></span>العادات</a>
      <a href="#/notes" data-route="notes" data-icon="note" class="nav-link"><span class="nav-icon"></span>ملاحظات شخصية</a>
      <a href="#/settings" data-route="settings" data-icon="settings" class="nav-link"><span class="nav-icon"></span>الإعدادات</a>
    </nav>
    <div class="nav-scrim" id="navScrim"></div>

    <main id="view" class="view"></main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
